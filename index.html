<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FootyStrength">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="AFL midfielder strength & conditioning program tracker">

  <title>FootyStrength</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- View container — all views render here -->
    <div id="view-container">
      <!-- Loading state -->
      <div style="display:flex;align-items:center;justify-content:center;height:80vh;flex-direction:column;gap:16px;">
        <div style="font-size:48px;">🏋️</div>
        <div style="color:#ebebf599;font-size:15px;">Loading FootyStrength…</div>
      </div>
    </div>
    <!-- Tab bar injected by app.js -->
  </div>

  <!-- Scripts — order matters: data first, then store, then app -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
